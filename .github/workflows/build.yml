name: EAS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g eas-cli
      - run: EAS_SKIP_AUTO_FINGERPRINT=1 eas build --platform android --profile production --non-interactive --account santhakills-team
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
